name: Compilar JockBall
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q proyecto.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0
      - run: gradle build
        working-directory: proyecto
      - uses: actions/upload-artifact@v4
        with:
          name: jockball-jar
          path: proyecto/build/libs/jockball-*[0-9].jar
